site_name: "Лаб. работа 2 — Потоки, процессы, асинхронность"
site_description: "Сравнение threading, multiprocessing и async в задачах вычислений и веб-парсинга"
site_author: Pavel Polyarus

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Обзор: index.md
  - "Задача 1: Параллельные вычисления": task1.md
  - "Задача 2: Параллельный парсинг": task2.md
